<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Private Kiss Bank 💋</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:ital,wght@0,400;0,600;1,400&display=swap');

        :root { 
            --deep-cherry: #9d0208;
            --love-red: #ff2a6d; 
            --soft-pink: #ff85a1; 
        }

        body {
            margin: 0; 
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            background: linear-gradient(135deg, #2b0d0d 0%, #5e0b1b 100%);
            font-family: 'Poppins', sans-serif; 
            overflow: hidden; 
            touch-action: manipulation;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px); 
            padding: 30px 20px; 
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center; 
            width: 85%; 
            max-width: 340px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative; 
            z-index: 10;
        }

        .header-text { 
            font-family: 'Dancing Script', cursive;
            font-size: 1.6rem; 
            color: var(--soft-pink); 
            margin-bottom: 5px;
        }

        #score { 
            font-size: 5rem; 
            color: white; 
            font-weight: 900; 
            margin: 5px 0; 
            text-shadow: 0 0 20px var(--love-red);
            transition: transform 0.1s ease;
        }

        .sub-label { 
            font-size: 0.9rem; 
            color: var(--soft-pink); 
            margin-bottom: 20px; 
            letter-spacing: 1px;
        }

        #phrase { 
            height: 90px; 
            color: #fff; 
            font-size: 1.1rem; 
            font-style: italic; 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            line-height: 1.4;
        }
        
        .kiss-btn {
            background: linear-gradient(to right, #ff2a6d, #9d0208);
            color: white; 
            border: none; 
            padding: 18px 0;
            font-size: 1.3rem; 
            border-radius: 100px; 
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 42, 109, 0.4); 
            transition: all 0.2s; 
            width: 100%; 
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }

        .kiss-btn:active { transform: scale(0.95); opacity: 0.9; }
        
        .floating-kiss { 
            position: fixed; 
            pointer-events: none; 
            z-index: 100; 
            animation: fly 2.5s cubic-bezier(0.1, 0.6, 0.3, 1) forwards; 
            font-size: 2rem; 
            filter: drop-shadow(0 0 10px var(--love-red));
        }

        @keyframes fly {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.5) rotate(45deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="app-card">
        <div class="header-text">Kisses you owe me...</div>
        <div id="score">...</div>
        <div class="sub-label">Syncing with Cloud 💋</div>
        <div id="phrase">Ready for some sugar?</div>
        
        <button class="kiss-btn" id="kissButton">Give me +8 Kisses</button>
    </div>

    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

        // Your specific Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyANql9VS2YCNv-79O7cWkFdfzJxn7LBqY4",
            authDomain: "kissbank-de26e.firebaseapp.com",
            databaseURL: "https://kissbank-de26e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kissbank-de26e",
            storageBucket: "kissbank-de26e.firebasestorage.app",
            messagingSenderId: "672311624309",
            appId: "1:672311624309:web:361178d0de93ea2eb7ae3c"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const kissRef = ref(db, 'kiss_count');

        let currentCount = 0;
        const scoreEl = document.getElementById('score');
        const phraseEl = document.getElementById('phrase');
        const kissButton = document.getElementById('kissButton');

        const flirtyLines = [
            "I just earned 8 more, I'm gonna be busy...",
            "I'm gonna be full with these kisses meals 😘",
            "Keep clicking, I'm ready to get all these from you",
            "ah ahh, that's a lot of sugar I'm asking for...",
            "I'm feeling like a threat now to get your kisses ",
            "Your kiss account is growing fast. I'm craving more 😏",
            "I hope you're ready to give all of these at once",
            "I am quite greedy for your kisses ❤️"
        ];

        // Sync with Database
        onValue(kissRef, (snapshot) => {
            currentCount = snapshot.val() || 0;
            scoreEl.innerText = currentCount;
            
            // Pop effect when database updates
            scoreEl.style.transform = "scale(1.1)";
            setTimeout(() => scoreEl.style.transform = "scale(1)", 100);
        });

        // Click Handler
        kissButton.addEventListener('click', () => {
            const nextCount = currentCount + 8;
            set(kissRef, nextCount); // Save to cloud

            // Change statement
            phraseEl.innerText = flirtyLines[Math.floor(Math.random() * flirtyLines.length)];
            
            // Animation
            createKiss();
        });

        function createKiss() {
            const k = document.createElement('div');
            k.className = 'floating-kiss';
            k.innerHTML = '💋';
            k.style.left = (Math.random() * 70 + 15) + 'vw';
            k.style.top = '70vh';
            document.body.appendChild(k);
            setTimeout(() => k.remove(), 2500);
        }
    </script>
</body>
</html>
